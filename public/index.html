<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pirovino Treffen</title><style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222;background:#faf9f6}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#faf9f6}
main{max-width:620px;margin:0 auto;padding:42px 20px 70px}header{text-align:center;margin-bottom:34px}
h1{font-size:38px;line-height:1.1;margin:0 0 14px;font-weight:750;letter-spacing:-.8px}.date{font-size:21px}.place{font-size:18px;color:#666}
.card{background:white;border:1px solid #e7e4de;border-radius:22px;padding:25px;box-shadow:0 3px 20px rgba(0,0,0,.035)}
label{display:block;font-size:20px;font-weight:650;margin:0 0 9px}input{width:100%;font:inherit;font-size:20px;padding:16px;border:2px solid #d9d6d0;border-radius:13px;background:white;outline:none}
input:focus{border-color:#555}.field{margin-bottom:25px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice button,.submit{font:inherit;font-size:20px;font-weight:700;padding:18px;border-radius:14px;border:2px solid #d9d6d0;background:#fff;color:#222;cursor:pointer;appearance:none;-webkit-appearance:none;-webkit-tap-highlight-color:transparent;outline:none;box-shadow:none}
.choice button:hover,.choice button:focus,.choice button:focus-visible,.choice button:active{background:#f3f3f3;color:#222;border-color:#777;outline:none;box-shadow:none;-webkit-tap-highlight-color:transparent}
.choice button.selected{border-color:#777;background:#eee;color:#222;outline:none;box-shadow:none}.submit{width:100%;background:#222;color:white;border-color:#222;margin-top:8px}
.guests{margin-top:10px}.guest-row{display:flex;gap:8px;margin:10px 0}.guest-row input{flex:1}.remove{width:52px;border:0;background:#eee;border-radius:12px;font-size:25px;cursor:pointer}
.add{border:0;background:none;padding:8px 0;font:inherit;font-size:18px;text-decoration:underline;cursor:pointer}.note{font-size:16px;color:#666;line-height:1.45;margin-top:8px}
.success{display:none;text-align:center;padding:20px 0}.success h2{font-size:30px;margin:8px 0 12px}.error{display:none;background:#fff1f0;border:1px solid #e8b5b0;border-radius:12px;padding:13px;margin-bottom:16px}
@media(max-width:480px){main{padding-top:28px}h1{font-size:33px}.choice{grid-template-columns:1fr}.card{padding:20px}}
</style></head><body><main>
<header><h1>Pirovino Treffen</h1><div class="date">Samstag, 12. Juni 2027</div><div class="place">Mörsburg, Winterthur</div></header>
<section class="card" id="formCard"><div id="error" class="error"></div>
<div class="field"><label for="name">Dein Name</label><input id="name" autocomplete="name" placeholder="Vorname und Nachname"></div>
<div class="field"><label>Kommst du?</label><div class="choice">
<button type="button" id="yes" onclick="setAttending(true)">Ja, ich komme</button>
<button type="button" id="no" onclick="setAttending(false)">Nein, leider nicht</button></div></div>
<div class="field" id="guestSection" style="display:none"><label>Wer kommt mit dir?</label><div class="note">Bitte jede Begleitperson mit Namen eintragen.</div>
<div class="guests" id="guests"></div><button type="button" class="add" onclick="addGuest()">+ Begleitperson hinzufügen</button></div>
<div class="field"><label for="email">E-Mail</label><input id="email" type="email" autocomplete="email" placeholder="Deine E-Mail-Adresse">
<div class="note">Damit du weitere Informationen bekommst zum Treffen.</div></div>
<button class="submit" onclick="submitRsvp()">Bestätigen</button></section>
<section class="card success" id="success"><h2 id="successTitle"></h2><p id="successText"></p></section>
</main><script>
let attending=null;const guestsEl=document.getElementById("guests");
function setAttending(v){attending=v;document.getElementById("yes").classList.toggle("selected",v);document.getElementById("no").classList.toggle("selected",!v);document.getElementById("guestSection").style.display=v?"block":"none";if(v&&!guestsEl.children.length)addGuest();if(!v)guestsEl.innerHTML=""}
function addGuest(){const row=document.createElement("div");row.className="guest-row";row.innerHTML='<input type="text" placeholder="Name der Begleitperson"><button type="button" class="remove" aria-label="Begleitperson entfernen">×</button>';row.querySelector(".remove").onclick=()=>row.remove();guestsEl.appendChild(row)}
function showError(m){const e=document.getElementById("error");e.textContent=m;e.style.display="block";window.scrollTo({top:0,behavior:"smooth"})}
async function submitRsvp(){document.getElementById("error").style.display="none";const name=document.getElementById("name").value.trim(),email=document.getElementById("email").value.trim(),guests=[...guestsEl.querySelectorAll("input")].map(x=>x.value.trim()).filter(Boolean);if(!name)return showError("Bitte deinen Namen eintragen.");if(attending===null)return showError("Bitte auswählen, ob du kommst.");if(attending&&!email)return showError("Bitte deine E-Mail-Adresse eingeben.");if(attending&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return showError("Bitte eine gültige E-Mail-Adresse eingeben.");try{const r=await fetch("/api/rsvp",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,attending,guests,email})});const d=await r.json();if(!r.ok)throw Error(d.error||"Etwas ist schiefgelaufen.");document.getElementById("formCard").style.display="none";document.getElementById("success").style.display="block";document.getElementById("successTitle").textContent=attending?"juhui :)":"schade :(";document.getElementById("successText").textContent=attending?(guests.length?"Wir freuen uns auf euch !":"Wir freuen uns auf dich !"):"Danke für deine Rückmeldung."}catch(e){showError(e.message)}}
</script></body></html>
